<mat-toolbar>
    <mat-toolbar-row>
        <div class="header_container">
            <div class="header_title">              
                <mat-icon>storefront</mat-icon> Ludoteca Tan
            </div>

            <div class="header_separator"> | </div>

            <div class="header_menu">       <!--Menú que nos llevará a cada una de las otras páginas-->
                <div class="header_button">
                    <a routerLink="/games" routerLinkActive="active">Catálogo</a>
                </div>
                <div class="header_button">
                    <a routerLink="/categories" routerLinkActive="active">Categorías</a>
                </div>
                <div class="header_button">
                    <a routerLink="/authors" routerLinkActive="active">Autores</a>
                </div>
                <div class="header_button">
                    <a routerLink="/clients" *ngIf="sessionService.isAuthenticated()" routerLinkActive="active">Clientes</a>
                </div>
                <div class="header_button">
                    <a routerLink="/prestamos" *ngIf="sessionService.isAuthenticated()" routerLinkActive="active">Préstamos</a>
                </div>
            </div>

            <div *ngIf="!sessionService.isAuthenticated()" class="header_login" (click)="signIn()">
                <mat-icon>account_circle</mat-icon> Sign in
            </div>

            <div *ngIf="sessionService.isAuthenticated()" class="header_login" (click)="logout()">
                <mat-icon>account_circle</mat-icon>Bienvenido
            </div>
        </div>
    </mat-toolbar-row>
</mat-toolbar>
