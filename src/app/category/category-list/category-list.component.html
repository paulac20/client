<div class="container">
    <h1>Listado de Categorías</h1>

    <mat-table [dataSource]="dataSource">   <!--Creamos la tabla con la variable dataSource definida en el fichero .ts-->
        <ng-container matColumnDef="id">    <!--Definición primera columna, su cabecera y el dato que va a contener-->
            <mat-header-cell *matHeaderCellDef> Identificador </mat-header-cell>
            <mat-cell *matCellDef="let element"> {{element.id}} </mat-cell>
        </ng-container>

        <ng-container matColumnDef="name">  <!--Segunda columna-->
            <mat-header-cell *matHeaderCellDef> Nombre categoría  </mat-header-cell>
            <mat-cell *matCellDef="let element"> {{element.name}} </mat-cell>
        </ng-container>

        <ng-container matColumnDef="action">    <!--Tercera columna-->
            <mat-header-cell *matHeaderCellDef></mat-header-cell>
            <!--*matCellDef indica a Angular el contenido que tiene que tener cada celda.
            Con "let element" se mete cada objeto de los datos en la variable element temporalmente-->
            <mat-cell *matCellDef="let element">
                <button class="edit" mat-icon-button (click)="editCategory(element)">
                    <mat-icon>edit</mat-icon>
                </button>
                <button mat-icon-button (click)="deleteCategory(element)">
                    <mat-icon>clear</mat-icon>
                </button>
            </mat-cell>
        </ng-container>

        <!--Construcción de la cabecera y las filas-->
        <mat-header-row *matHeaderRowDef="displayedColumns; sticky: true"></mat-header-row>
        <mat-row *matRowDef="let row; columns: displayedColumns;"></mat-row>
    </mat-table>

    <div class="buttons">   <!--Botón para añadir nuevas categorías-->
        <!--Enlazamos el método al click del botón-->
        <button mat-flat-button color="primary" (click)="createCategory()">Nueva categoría</button>
    </div>   
</div>
